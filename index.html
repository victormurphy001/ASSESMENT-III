
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">

        <h1>Currency Converter</h1>
        <p class="subtitle">Convert currencies instantly</p>

        <div class="input-group">
            <label>Amount</label>
            <input type="number" id="amount" value="1" min="0">
        </div>

        <div class="currency-box">

            <div class="currency">
                <label>From</label>
                <select id="fromCurrency">
                    <option value="USD">USD - US Dollar</option>
                    <option value="NGN">NGN - Nigerian Naira</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="GHS">GHS - Ghanaian Cedi</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                </select>
            </div>

            <button id="swapBtn" class="swap-btn">⇄</button>

            <div class="currency">
                <label>To</label>
                <select id="toCurrency">
                    <option value="NGN">NGN - Nigerian Naira</option>
                    <option value="USD">USD - US Dollar</option>
                    <option value="GBP">GBP - British Pound</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="CAD">CAD - Canadian Dollar</option>
                    <option value="GHS">GHS - Ghanaian Cedi</option>
                    <option value="INR">INR - Indian Rupee</option>
                    <option value="JPY">JPY - Japanese Yen</option>
                </select>
            </div>

        </div>

        <button id="convertBtn" class="convert-btn">
            Convert Currency
        </button>

        <div class="result">
            <p>Converted Amount</p>
            <h2 id="result">0.00 NGN</h2>
            <small id="rateInfo">Exchange rate will appear here.</small>
        </div>

        <p id="status"></p>

    </div>

</body>
</html>
